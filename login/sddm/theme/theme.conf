# Defaults for the end4-material login screen. sync.sh writes your wallpaper,
# colours and fonts to /var/lib/end4-material-sddm/theme.conf.user, which SDDM
# reads on top of this file through the theme.conf.user link next to it.
[General]
# Where sync.sh puts the wallpaper, avatar and fonts.
syncDir=/var/lib/end4-material-sddm
# Used when nothing has been synced yet. A path relative to this folder, or absolute.
background=
# Blur and dim the wallpaper like the lock screen.
blur=true
fontFamily="Google Sans Flex"
clockFontFamily="Google Sans Flex"
clockFontWeight=350
# Qt date/time formats: https://doc.qt.io/qt-6/qml-qtqml-qt.html#formatDateTime-method
timeFormat="hh:mm"
dateFormat="dddd, d MMMM"
# Show the password box on every monitor (false: only on the primary one).
formOnAllScreens=true
