[package]
name = "material_3_settings"
version = "0.1.0"
edition = "2021"
description = "A Material 3 settings manager for Arch Linux, built with egui"

[[bin]]
name = "m3-settings"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.37"
egui_material_icons = { version = "0.9", features = ["filled", "outline"] }
material-colors = "0.4"
notify = "6"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
toml_edit = "0.23"
dirs = "6"
anyhow = "1"
chrono = "0.4"
fuzzy-matcher = "0.3"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
