[package]
name = "material_3_settings"
version = "0.1.0"
edition = "2021"
description = "A Material 3 settings manager for Arch Linux, built with egui"
license = "MIT"

[[bin]]
name = "m3-settings"
path = "src/main.rs"

[dependencies]
material-3-ui = { git = "https://github.com/bhimio1/material-3-ui", rev = "b685313f045a275a514be6e0018f71dfdf7cc0bf", features = ["backups", "image"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.37"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
toml_edit = "0.23"
dirs = "6"
anyhow = "1"
chrono = "0.4"
fuzzy-matcher = "0.3"
log = "0.4"
env_logger = "0.11"
ureq = { version = "2.12", features = ["json", "native-certs"] }
sha2 = "0.10"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
